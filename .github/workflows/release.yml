name: Build

# Builds the app and DMG on every push and pull request.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the DMG attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: macos-26   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Build app
        run: BUILD_NUMBER=${{ github.run_number }} ./build.sh

      - name: Package DMG
        run: scripts/make-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-dmg
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          overwrite_files: false   # keep a DMG that was already uploaded and tested by hand
          generate_release_notes: true
